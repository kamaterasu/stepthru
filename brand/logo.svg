<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>stepthru</title>
  <style>
    .base { fill: #1b1a24; }
    .step { fill: #5b3fd9; }
    @media (prefers-color-scheme: dark) {
      .base { fill: #ecebf5; }
      .step { fill: #a594ff; }
    }
  </style>
  <rect class="base" x="1" y="9" width="4" height="6" rx="1"/>
  <rect class="base" x="6" y="5" width="4" height="10" rx="1"/>
  <rect class="step" x="11" y="1" width="4" height="14" rx="1"/>
</svg>
